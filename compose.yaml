name: choco

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: choco
      POSTGRES_PASSWORD: choco
      POSTGRES_DB: choco
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choco -d choco"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  tbls:
    image: ghcr.io/k1low/tbls:v1.96.1
    profiles: [tools]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      TBLS_DSN: postgres://choco:choco@postgres:5432/choco?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
