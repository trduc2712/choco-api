name: choco

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: choco
      POSTGRES_PASSWORD: choco
      POSTGRES_DB: choco
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U choco -d choco"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      AWS_ACCESS_KEY_ID: choco
      AWS_SECRET_ACCESS_KEY: choco-secret
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - seaweedfs-data:/data

  storage-init:
    image: amazon/aws-cli:2.39.6
    profiles: [tools]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for bucket in trduc2712-choco-development-uploads trduc2712-choco-development-media; do
          aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$bucket 2>/dev/null \
            || aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket $$bucket
        done
    environment:
      AWS_ACCESS_KEY_ID: choco
      AWS_SECRET_ACCESS_KEY: choco-secret
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      seaweedfs:
        condition: service_healthy

  tbls:
    image: ghcr.io/k1low/tbls:v1.96.1
    profiles: [tools]
    working_dir: /work
    volumes:
      - .:/work
    environment:
      TBLS_DSN: postgres://choco:choco@postgres:5432/choco?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
